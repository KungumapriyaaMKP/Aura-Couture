<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Velvet-Crimson Seal Background -->
    <radialGradient id="velvetBg" cx="30%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#9e2a43"/>
      <stop offset="55%" stop-color="#6e1629"/>
      <stop offset="100%" stop-color="#3b0c17"/>
    </radialGradient>

    <!-- 24K Champagne Gold Metallic Gradient -->
    <linearGradient id="champagneGold" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="35%" stop-color="#f3d299"/>
      <stop offset="70%" stop-color="#d4a359"/>
      <stop offset="100%" stop-color="#f7dfaf"/>
    </linearGradient>

    <!-- Soft Rose-Pearl Highlight Gradient -->
    <linearGradient id="pearlSilk" x1="12" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f3c1cf"/>
    </linearGradient>
  </defs>

  <!-- Luxury Rounded Crest Seal -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#velvetBg)" stroke="url(#champagneGold)" stroke-width="2.2"/>
  <rect x="6" y="6" width="52" height="52" rx="11.5" stroke="url(#champagneGold)" stroke-opacity="0.38" stroke-width="0.9"/>

  <!-- Signature Calligraphic Silk Ribbon Flourish (matching AuraCoutureVectorLogo) -->
  <path
    d="M11 40.5C7.5 34.5 11.5 24 20.5 25.5C26.5 26.5 26.5 34.5 18 39.5C13 42.5 25 46.5 41 38.5C47.5 35.2 52.5 36.2 54.5 39"
    stroke="url(#champagneGold)"
    stroke-width="2.4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Sculpted High-Fashion Didone Serif "A" Monogram (Pure Vector Paths for Razor-Sharp 16px Rendering) -->
  <!-- Left Thin Ascender -->
  <path
    d="M32.2 13L18.2 48.5"
    stroke="url(#pearlSilk)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- Right Thick Sculpted Stem -->
  <path
    d="M31.2 13L35.2 13L48.5 48.5L42.8 48.5L31.2 13Z"
    fill="url(#pearlSilk)"
  />
  <!-- Delicate Crossbar -->
  <path
    d="M23 36.5H40.5"
    stroke="url(#champagneGold)"
    stroke-width="2.1"
    stroke-linecap="round"
  />
  <!-- Crisp Haute Couture Serif Terminals (Base Left & Base Right) -->
  <path
    d="M14.2 48.5H22.5M39.2 48.5H51.2"
    stroke="url(#pearlSilk)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Top Sovereign Diamond Star Sparkle -->
  <path
    d="M47 13L48.1 16.4L51.5 17.5L48.1 18.6L47 22L45.9 18.6L42.5 17.5L45.9 16.4L47 13Z"
    fill="url(#champagneGold)"
  />
</svg>
