<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="50%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f3c6d3"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c44563"/>
      <stop offset="50%" stop-color="#a02e46"/>
      <stop offset="100%" stop-color="#6e1729"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e6b980"/>
      <stop offset="50%" stop-color="#d49b6a"/>
      <stop offset="100%" stop-color="#b57c4e"/>
    </linearGradient>
  </defs>

  <!-- Soft Blush Porcelain Medallion Base -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="14" stroke="#a02e46" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Outer Blooming Couture Rose Petals -->
  <path
    d="M32 11C25 11 19 16.5 19 23.5C19 20 13.5 22 13.5 28.5C13.5 35.5 21 41.5 32 45C43 41.5 50.5 35.5 50.5 28.5C50.5 22 45 20 45 23.5C45 16.5 39 11 32 11Z"
    fill="url(#roseGrad)"
    fill-opacity="0.14"
  />

  <!-- Sculpted Couture Dress Silhouette / Rose Bud Crest -->
  <!-- Bodice Heart Cut -->
  <path
    d="M25.5 22C25.5 19.5 28.5 18.5 32 21.2C35.5 18.5 38.5 19.5 38.5 22C38.5 25.5 35.5 28.5 32 30.5C28.5 28.5 25.5 25.5 25.5 22Z"
    fill="url(#roseGrad)"
  />

  <!-- Flowing Ballgown Skirt Drapery -->
  <path
    d="M29 30.5L17 48.5C22 51 27 52 32 52C37 52 42 51 47 48.5L35 30.5C33.8 31.2 30.2 31.2 29 30.5Z"
    fill="url(#roseGrad)"
  />

  <!-- Delicate Silk Pleat Highlights -->
  <path
    d="M32 31V50.5M29.5 31.5L23.5 49M34.5 31.5L40.5 49"
    stroke="#fff5f8"
    stroke-width="1.3"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />

  <!-- Golden Waist Belt & Top Couture Star Sparkle -->
  <path
    d="M27.5 30.2C30 31.2 34 31.2 36.5 30.2"
    stroke="url(#goldGrad)"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M32 9.5L33.3 13.2L37 14.5L33.3 15.8L32 19.5L30.7 15.8L27 14.5L30.7 13.2L32 9.5Z"
